name: Registros diarios sem alterar o codigo

on:
  schedule:
    # 03h01 UTC = 00h01 no horario de Brasilia.
    - cron: '1 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: registros-diarios
  cancel-in-progress: false

jobs:
  registrar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: America/Sao_Paulo
      GIT_AUTHOR_NAME: Matheus
      GIT_AUTHOR_EMAIL: matheusvm2019@gmail.com
      GIT_COMMITTER_NAME: Matheus
      GIT_COMMITTER_EMAIL: matheusvm2019@gmail.com

    steps:
      - name: Baixar o historico da branch principal
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Criar de 8 a 25 registros vazios para o dia
        shell: python
        run: |
          import datetime
          import os
          import random
          import subprocess
          from pathlib import Path
          from zoneinfo import ZoneInfo

          def git(*args):
              return subprocess.check_output(
                  ["git", *args], text=True
              ).strip()

          if git("status", "--porcelain"):
              raise RuntimeError(
                  "A pasta deve estar sem alteracoes antes dos registros."
              )

          dia = datetime.datetime.now(
              ZoneInfo("America/Sao_Paulo")
          ).date().isoformat()

          arvore_inicial = git("rev-parse", "HEAD^{tree}")
          mensagens = set(git("log", "--format=%s").splitlines())
          prefixo = f"Registro automatico vazio - {dia} - "

          # Reutiliza o limite do dia caso o workflow seja executado novamente.
          limites_existentes = set()
          for mensagem in mensagens:
              if mensagem.startswith(prefixo):
                  sufixo = mensagem[len(prefixo):]
                  partes = sufixo.split("/")
                  if len(partes) == 2 and all(
                      parte.isdigit() for parte in partes
                  ):
                      limite = int(partes[1])
                      if 8 <= limite <= 25:
                          limites_existentes.add(limite)

          quantidade = (
              max(limites_existentes)
              if limites_existentes
              else random.randint(8, 25)
          )

          criados = 0

          for numero in range(1, quantidade + 1):
              mensagem = (
                  f"{prefixo}{numero:02d}/{quantidade:02d}"
              )

              if mensagem in mensagens:
                  continue

              subprocess.run(
                  [
                      "git",
                      "-c",
                      "core.hooksPath=/dev/null",
                      "commit",
                      "--allow-empty",
                      "-m",
                      mensagem,
                  ],
                  check=True,
              )
              criados += 1

          if git("rev-parse", "HEAD^{tree}") != arvore_inicial:
              raise RuntimeError(
                  "O conteudo mudou. Envio interrompido."
              )

          subprocess.run(
              ["git", "push", "origin", "HEAD:main"],
              check=True,
          )

          resumo = (
              f"{dia}: {criados} commits vazios criados; "
              f"limite do dia: {quantidade}; arquivos preservados."
          )
          print(resumo)

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with Path(summary_path).open(
                  "a", encoding="utf-8"
              ) as arquivo:
                  arquivo.write(f"## Registros diarios — {dia}\n\n")
                  arquivo.write(resumo + "\n")
