name: Registros diarios sem alterar o codigo

on:
  schedule:
    # 15h17 UTC = 12h17 no horario de Brasilia.
    - cron: '17 15 * * *'
  workflow_dispatch:

# Token temporario do GitHub, limitado ao conteudo deste repositorio.
permissions:
  contents: write

concurrency:
  group: registros-diarios
  cancel-in-progress: false

jobs:
  registrar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: America/Sao_Paulo
      GIT_AUTHOR_NAME: Matheus
      GIT_AUTHOR_EMAIL: matheusvm2019@gmail.com
      GIT_COMMITTER_NAME: Matheus
      GIT_COMMITTER_EMAIL: matheusvm2019@gmail.com
    steps:
      - name: Baixar o historico da branch principal
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Criar ate 20 registros vazios para o dia
        shell: python
        run: |
          import datetime
          import os
          import subprocess
          from pathlib import Path
          from zoneinfo import ZoneInfo

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          if git("status", "--porcelain"):
              raise RuntimeError("A pasta deve estar sem alteracoes antes dos registros.")

          dia = datetime.datetime.now(ZoneInfo("America/Sao_Paulo")).date().isoformat()
          arvore_inicial = git("rev-parse", "HEAD^{tree}")
          mensagens = set(git("log", "--format=%s").splitlines())
          criados = 0

          for numero in range(1, 21):
              mensagem = f"Registro automatico vazio - {dia} - {numero:02d}/20"
              # Rodar novamente no mesmo dia nao duplica os registros.
              if mensagem in mensagens:
                  continue
              subprocess.run([
                  "git", "-c", "core.hooksPath=/dev/null", "commit",
                  "--allow-empty", "-m", mensagem
              ], check=True)
              criados += 1

          if git("rev-parse", "HEAD^{tree}") != arvore_inicial:
              raise RuntimeError("O conteudo mudou. Envio interrompido.")

          subprocess.run(["git", "push", "origin", "HEAD:main"], check=True)
          resumo = f"{dia}: {criados} registros vazios criados; arquivos preservados."
          print(resumo)
          if os.environ.get("GITHUB_STEP_SUMMARY"):
              with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as arquivo:
                  arquivo.write(resumo + "\n")
